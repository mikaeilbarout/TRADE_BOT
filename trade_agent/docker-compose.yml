services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trade_agent:trade_agent@postgres:5432/trade_agent
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trade_agent
      POSTGRES_PASSWORD: trade_agent
      POSTGRES_DB: trade_agent
    # Only reachable from this host (and the api container via the compose network):
    # the credentials above are public defaults, so never expose it to the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - trade_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Redis has no password: local access only.
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  trade_agent_pgdata:
